<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="歌月菌的项目资料库，包含 PDF、图片与文档资源。">
    <title>项目资料库 - 歌月菌的个人博客</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
</head>
<body>
    <div class="blob-field" aria-hidden="true">
        <span class="blob-pink"></span>
        <span class="blob-purple"></span>
        <span class="blob-cyan"></span>
        <span class="blob-pink-sm"></span>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">歌月菌</a>
            <ul class="nav-links" aria-label="主导航">
                <li><a href="index.html">首页</a></li>
                <li><a href="articles.html">文章</a></li>
                <li><a href="projects.html" class="active">项目</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle" type="button"></button>
        </div>
    </nav>

    <main class="site-main">
        <section class="site-shell blog-header page-transition">
            <div>
                <p class="eyebrow">Project Library</p>
                <h1 class="page-title">项目资料库</h1>
                <p class="page-lede">项目页是可检索的文件层：报告、截图和 Word 文档按资源类型整理，方便从文章回到原始材料。</p>
            </div>
        </section>

        <section class="site-shell">
            <div class="project-categories" aria-label="项目分类">
                <button class="category-btn active" type="button" data-category="all">全部</button>
                <button class="category-btn" type="button" data-category="pdf">PDF</button>
                <button class="category-btn" type="button" data-category="image">图片</button>
                <button class="category-btn" type="button" data-category="doc">文档</button>
            </div>
            <div class="projects-grid" data-render="projects"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 歌月菌的个人博客</p>
            <div class="social-links">
                <a href="index.html" aria-label="首页">H</a>
                <a href="articles.html" aria-label="文章">A</a>
                <a href="about.html" aria-label="关于">M</a>
            </div>
        </div>
    </footer>

    <script src="scripts/site-data.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/animations.js"></script>
</body>
</html>
