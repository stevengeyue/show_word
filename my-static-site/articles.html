<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="歌月菌的文章索引，包含智能优化、数据科学、工程实践与全栈开发。">
    <title>文章索引 - 歌月菌的知识工作台</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">歌月菌</a>
            <ul class="nav-links" aria-label="主导航">
                <li><a href="index.html">首页</a></li>
                <li><a href="articles.html" class="active">文章</a></li>
                <li><a href="projects.html">项目</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle" type="button"></button>
        </div>
    </nav>

    <main class="site-main">
        <section class="site-shell blog-header page-transition">
            <div>
                <p class="eyebrow">Article Index</p>
                <h1 class="page-title">文章地图</h1>
                <p class="page-lede">内容从算法、数据、工程扩展到 AI 学习、可视化、静态站设计、建模写作和知识管理。每张卡片都写清“问题”和“方法”。</p>
            </div>
        </section>

        <section class="site-shell">
            <div class="section-head">
                <div>
                    <p class="eyebrow">Collections</p>
                    <h2>按专题阅读</h2>
                </div>
                <p>先选方向，再进入文章；比按时间排序更像一个学习地图。</p>
            </div>
            <div class="collection-grid" data-render="collections"></div>
        </section>

        <section class="site-shell">
            <div class="section-head">
                <div>
                    <p class="eyebrow">All Notes</p>
                    <h2>全部文章</h2>
                </div>
            </div>
            <div class="posts-grid" data-render="articles"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 歌月菌的知识工作台</p>
            <div class="social-links">
                <a href="index.html" aria-label="首页">H</a>
                <a href="projects.html" aria-label="项目">P</a>
                <a href="about.html" aria-label="关于">M</a>
            </div>
        </div>
    </footer>

    <script src="scripts/site-data.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/animations.js"></script>
</body>
</html>
